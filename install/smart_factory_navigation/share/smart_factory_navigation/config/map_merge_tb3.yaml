map_merge:
  ros__parameters:
    use_sim_time: true

    # publishing /map (global)
    merged_map_topic: /map

    # IMPORTANT: make the merged OccupancyGrid frame_id match Nav2 expectations
    world_frame: map

    # Map topics each robot publishes (relative => /TB3_1/map, /TB3_2/map)
    robot_map_topic: map
    robot_map_updates_topic: map_updates

    # Discovery / merge tuning (defaults are fine to start)
    merging_rate: 2.0
    discovery_rate: 0.2
    estimation_rate: 0.5
    estimation_confidence: 0.6

    # If you know the robots’ initial relative poses in the map frame, set true.
    known_init_poses: true

    # Put YOUR robots’ initial poses here (example values!)
    # Use the positions you spawned them at in Gazebo/world.
    /TB3_1/map_merge/init_pose_x: -2.0
    /TB3_1/map_merge/init_pose_y: -0.5
    /TB3_1/map_merge/init_pose_z: 0.0
    /TB3_1/map_merge/init_pose_yaw: 0.0

    /TB3_2/map_merge/init_pose_x: 0.0
    /TB3_2/map_merge/init_pose_y: 0.0
    /TB3_2/map_merge/init_pose_z: 0.0
    /TB3_2/map_merge/init_pose_yaw: 0.0