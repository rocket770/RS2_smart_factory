merge_map:
  ros__parameters:
    use_sim_time: false
    map_topic_regex: "^/tb\\d+/map$"
    publish_topic: "/map"
    input_reliability: "best_effort"
    output_reliability: "reliable"
    scan_period_sec: 1.0
    merged_frame_id: "map"
    unknown_value: -1
    occupied_threshold: 50
    overwrite_known_cells: false
    conflict_policy: "prefer_free"
    free_space_clear_radius_cells: 0
