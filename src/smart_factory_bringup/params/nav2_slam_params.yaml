# Must be able to tell planner to move around obstacle
controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 25.0 # 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    # Check this one
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # originally was 0.5 in 10s
      # now do in 0.05m in 30secs
      required_movement_radius: 0.05
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25 #0.35
      yaw_goal_tolerance: 0.30 #0.35
      stateful: True

    # FollowPath:
    #   #plugin: "dwb_core::DWBLocalPlanner"
    #   plugin: "nav2_mppi_controller::MPPIController"
    #   debug_trajectory_details: True
    #   min_vel_x: 0.0
    #   min_vel_y: 0.0
    #   max_vel_x: 0.18 # 0.26
    #   max_vel_y: 0.0
    #   max_vel_theta: 1.5
    #   min_speed_xy: 0.0
    #   max_speed_xy: 0.26
    #   min_speed_theta: 0.25
    #   acc_lim_x: 1.2 #2.5
    #   acc_lim_y: 0.0
    #   acc_lim_theta: 3.2
    #   decel_lim_x: -2.5
    #   decel_lim_y: 0.0
    #   decel_lim_theta: -3.2
    #   vx_samples: 20
    #   vy_samples: 5
    #   vtheta_samples: 20
    #   sim_time: 0.8
    #   linear_granularity: 0.05
    #   angular_granularity: 0.025
    #   transform_tolerance: 0.2
    #   xy_goal_tolerance: 0.25
    #   trans_stopped_velocity: 0.03
    #   short_circuit_trajectory_evaluation: True
    #   stateful: True
    #   critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
    #   BaseObstacle.scale: 0.6 # 0.2 putting it higher makes it more sensitive to obstacles
    #   PathAlign.scale: 8.0 # 16.0
    #   PathAlign.forward_point_distance: 0.1
    #   GoalAlign.scale: 6.0 # 12.0
    #   GoalAlign.forward_point_distance: 0.1
    #   PathDist.scale: 30.0 # was 24.0 # Now a stronger weight applied to obstacles
    #   GoalDist.scale: 22.0 # 16.0 
    #   RotateToGoal.scale: 40.0
    #   RotateToGoal.slowing_factor: 5.0
    #   RotateToGoal.lookahead_time: -1.0

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # MPPI recommended parameters for TurtleBot3 (DiffDrive)
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false                     # set true if you want to see trajectories in RViz
      publish_optimal_trajectory: true

      # Velocity and acceleration limits (conservative for real TB3)
      vx_max: 0.22
      vx_min: -0.15
      vy_max: 0.0
      wz_max: 1.8
      ax_max: 2.0
      ax_min: -2.0
      ay_max: 0.0
      ay_min: 0.0
      az_max: 3.5

      # Noise (sampling)
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.35

      # Critics - good balance for obstacle avoidance + path following
      critics: [
        "ConstraintCritic",
        "CostCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "PreferForwardCritic"
      ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        near_collision_cost: 200
        critical_cost: 300.0
        collision_cost: 1000000.0
        consider_footprint: false

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        max_path_occupancy_ratio: 0.05
        threshold_to_consider: 0.5

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.5

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

