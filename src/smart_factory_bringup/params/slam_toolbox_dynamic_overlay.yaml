slam_toolbox:
  ros__parameters:
    # Real TurtleBot3 Waffle Pi + LDS-01 tuning.
    # The LDS-01 is short range and comparatively noisy near its limits, so
    # we keep scan updates responsive while constraining matching to the useful
    # part of the scan.
    map_update_interval: 0.5
    minimum_time_interval: 0.10
    transform_publish_period: 0.05
    resolution: 0.05
 
    throttle_scans: 1
    min_laser_range: 0.12
    max_laser_range: 3.2
 
    # Lower than slam_toolbox defaults so the map updates during slow manual
    # driving, but not so low that every tiny wheel encoder jitter is fused.
    minimum_travel_distance: 0.03
    minimum_travel_heading: 0.03
 
    use_scan_matching: true
    use_scan_barycenter: true
    do_loop_closing: true
 
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 3.2
    link_scan_maximum_distance: 1.2
    loop_search_maximum_distance: 2.5
 
    # Slightly stricter matching helps on real hardware where scans are less
    # clean than Gazebo.
    link_match_minimum_response_fine: 0.12
    loop_match_minimum_chain_size: 8
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.30
    loop_match_minimum_response_fine: 0.40
 
    correlation_search_space_dimension: 0.4
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.08
 
    loop_search_space_dimension: 6.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
 
    distance_variance_penalty: 1.0
    angle_variance_penalty: 1.5
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
 
    min_pass_through: 2
    occupancy_threshold: 0.10