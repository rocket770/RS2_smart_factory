amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: TB3_2/odom
    base_frame_id: TB3_2/base_footprint
    scan_topic: scan
    min_particles: 500
    max_particles: 2000
    set_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""   # overridden by launch arg "map"

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: TB3_2/base_link
    odom_topic: odom

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 15.0
    controller_plugins: ["FollowPath"]
    FollowPath.plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
    FollowPath.desired_linear_vel: 0.25
    FollowPath.lookahead_dist: 0.6
    FollowPath.min_lookahead_dist: 0.3
    FollowPath.max_lookahead_dist: 1.0
    FollowPath.use_rotate_to_heading: true
    FollowPath.rotate_to_heading_angular_vel: 0.8

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased.plugin: "nav2_navfn_planner/NavfnPlanner"
    GridBased.tolerance: 0.5
    GridBased.allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: TB3_2/base_link
    behavior_plugins: ["spin", "backup", "wait"]
    spin.plugin: "nav2_behaviors/Spin"
    backup.plugin: "nav2_behaviors/BackUp"
    wait.plugin: "nav2_behaviors/Wait"

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: TB3_2/odom
      robot_base_frame: TB3_2/base_link
      rolling_window: true
      width: 3.0
      height: 3.0
      resolution: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: scan
          data_type: "LaserScan"
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: TB3_2/base_link
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: scan
          data_type: "LaserScan"
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55

lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - map_server
      - amcl
      - planner_server
      - controller_server
      - behavior_server
      - bt_navigator
      - local_costmap
      - global_costmap