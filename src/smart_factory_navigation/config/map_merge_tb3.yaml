map_merge:
  ros__parameters:
    use_sim_time: true

    merged_map_topic: /map
    world_frame: map

    robot_map_topic: map
    robot_map_updates_topic: map_updates

    merging_rate: 10.0
    discovery_rate: 2.0
    estimation_rate: 10.0
    estimation_confidence: 0.7

    known_init_poses: true

    /tb1/map_merge/init_pose_x: 0.0
    /tb1/map_merge/init_pose_y: -0.5
    /tb1/map_merge/init_pose_z: 0.01
    /tb1/map_merge/init_pose_yaw: 0.0

    /tb2/map_merge/init_pose_x: 1.7
    /tb2/map_merge/init_pose_y: 0.0
    /tb2/map_merge/init_pose_z: 0.01
    /tb2/map_merge/init_pose_yaw: 0.0


